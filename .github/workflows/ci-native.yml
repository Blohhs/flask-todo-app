name: CI Native Flask

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install markupsafe==2.0.1

      - name: Run Flask server in background
        run: |
          # Запускаем сервер напрямую, указывая правильный путь к приложению
          export FLASK_APP=application:create_app
          nohup flask run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          
          echo "Ожидание запуска сервера..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/ > /dev/null 2>&1; then
              echo "Сервер запустился с попытки $i"
              break
            fi
            sleep 1
          done
          echo "----- Логи сервера -----"
          cat flask.log

      - name: Smoke test Flask server
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:5000/
          echo "Smoke test passed"

      - name: Show flask log on failure
        if: failure()
        run: cat flask.log || true