name: CI Native Flask

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (валидация кода)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Initialize SQLite database
        run: |
          export FLASK_APP=manage.py
          flask db upgrade
          echo "Database initialized successfully"

      - name: Run Flask server in background
        run: |
          export FLASK_APP=manage.py
          nohup python manage.py runserver > flask.log 2>&1 &
          
          echo "Ожидание запуска сервера..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/ > /dev/null 2>&1; then
              echo "Сервер запустился с попытки $i"
              break
            fi
            sleep 1
          done
          echo "----- Логи запуска (flask.log) -----"
          cat flask.log

      - name: Smoke test Flask server
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:5000/
          echo "Smoke test passed"

      - name: Show flask log on failure
        if: failure()
        run: cat flask.log || true